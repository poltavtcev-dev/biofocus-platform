name: CI

# Path policy (save Actions minutes — macOS is billed ×10):
# - docs / handoffs / .cursor / markdown-only → no rust/desktop jobs
# - crates / companion / lockfile → rust-core (ubuntu)
# - apps/desktop → desktop (macos); on push to main, any code change also runs desktop (merge gate)
# - workflow_dispatch → full suite
#
# TEMP (billing / spending limit exhausted, 2026-08-06): auto triggers OFF.
# Only manual "Run workflow" — restore `push` + `pull_request` when Actions minutes reset.
# Until then: local cargo/pnpm = gate; agents may push related clusters straight to main.

on:
  # push:
  #   branches: [main, master]
  # pull_request:
  #   branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# paths-filter lists PR files via GitHub API → needs pull-requests: read
permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.set.outputs.rust }}
      desktop: ${{ steps.set.outputs.desktop }}
    steps:
      - name: Checkout
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Path filter
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'apps/companion/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'
            desktop:
              - 'apps/desktop/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.github/workflows/ci.yml'

      - name: Set outputs
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "desktop=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rust=${{ steps.filter.outputs.rust }}" >> "$GITHUB_OUTPUT"
          echo "desktop=${{ steps.filter.outputs.desktop }}" >> "$GITHUB_OUTPUT"

  rust-core:
    name: Rust core (check + test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo check (workspace, exclude desktop)
        run: cargo check --workspace --exclude desktop

      - name: cargo test (bio-spec, runtime, storage, ingest, pipeline, feature-engine, plugin-sdk, macos-collector, companion)
        run: cargo test -p bio-spec -p runtime -p storage -p ingest -p pipeline -p feature-engine -p plugin-sdk -p macos-collector -p companion

  desktop:
    name: Desktop (Rust + frontend)
    needs: changes
    # PR: only when desktop / workspace meta / this workflow changes.
    # Push to main/master: also when rust paths change (catch crate→desktop API breaks).
    # Manual: always (via changes outputs).
    if: |
      needs.changes.outputs.desktop == 'true' ||
      (github.event_name == 'push' && needs.changes.outputs.rust == 'true')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: cargo test -p desktop
        run: cargo test -p desktop

      - name: pnpm install + build
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Boundary — UI must not touch SQLite
        run: |
          set -euo pipefail
          if grep -RInE 'rusqlite|CREATE TABLE|biofocus_main\.db' \
            apps/desktop/src apps/desktop/dist; then
            echo "::error::UI↛DB boundary violated (rusqlite / SQL / db filename in frontend)"
            exit 1
          fi
          echo "Boundary clean."

  # Single required-check friendly gate: success when heavy jobs succeed or were skipped.
  ci-gate:
    name: CI gate
    needs: [changes, rust-core, desktop]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate job results
        run: |
          detect="${{ needs.changes.result }}"
          rust="${{ needs.rust-core.result }}"
          desk="${{ needs.desktop.result }}"
          echo "detect=$detect rust-core=$rust desktop=$desk"
          if [ "$detect" != "success" ]; then
            echo "::error::CI failed (detect paths=$detect)"
            exit 1
          fi
          for r in "$rust" "$desk"; do
            case "$r" in
              success|skipped) ;;
              *)
                echo "::error::CI failed (rust-core=$rust desktop=$desk)"
                exit 1
                ;;
            esac
          done
          echo "CI gate OK"
